version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: secret
      MYSQL_DATABASE: benchmark_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server-go:
    build:
      context: .
      dockerfile: Dockerfile.go
    ports:
      - "8004:8004"
    depends_on:
      mysql:
        condition: service_healthy

  server-nodejs:
    build:
      context: .
      dockerfile: Dockerfile.nodejs
    ports:
      - "8002:8002"
    depends_on:
      mysql:
        condition: service_healthy

  server-python:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy

  server-java:
    build:
      context: .
      dockerfile: Dockerfile.java
    ports:
      - "8005:8005"
    depends_on:
      mysql:
        condition: service_healthy

  server-php:
    build:
      context: .
      dockerfile: Dockerfile.php
    ports:
      - "8003:8003"
    depends_on:
      mysql:
        condition: service_healthy
