version: '3.8'

services:
  server-python:
    build:
      context: frameworks/python/fastapi
      dockerfile: Dockerfile
    container_name: server-python-post
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: admin
      DB_PASS: secret
      DB_NAME: benchmark_db
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  server-node:
    build:
      context: frameworks/nodejs/fastify
      dockerfile: Dockerfile
    container_name: server-node-post
    ports:
      - "8002:8002"
    extra_hosts:
