      - "8003:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: admin
      DB_PASS: secret
      DB_NAME: benchmark_db
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  server-go:
    build:
      context: frameworks/go/fiber
      dockerfile: Dockerfile
    container_name: server-go-post
    ports:
      - "8004:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: admin
      DB_PASS: secret
      DB_NAME: benchmark_db
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  server-java:
    build:
      context: frameworks/java/springboot
      dockerfile: Dockerfile
    container_name: server-java-post
    ports:
      - "8005:8005"
