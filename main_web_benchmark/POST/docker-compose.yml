    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: admin
      DB_PASS: secret
      DB_NAME: benchmark_db
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  server-php:
