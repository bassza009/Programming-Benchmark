version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: benchmark-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: benchmark_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    command: >
      postgres
      -c max_connections=10000
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c checkpoint_timeout=30min
      -c max_wal_size=10GB
      -c min_wal_size=1GB
      -c synchronous_commit=off
      -c wal_writer_delay=50ms
      -c max_parallel_workers=8
      -c max_parallel_workers_per_gather=4
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./add_indexes.sql:/docker-entrypoint-initdb.d/03_indexes.sql:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    shm_size: '2gb'

volumes:
  postgres_data:
