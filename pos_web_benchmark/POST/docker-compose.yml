version: '3.8'

services:
  server-python:
    build:
      context: frameworks/python/fastapi
      dockerfile: Dockerfile
    container_name: pos-server-python-post
    ports:
      - "8001:8001"
    environment:
      DB_HOST: benchmark-postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASS: secret
      DB_NAME: benchmark_db
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  server-node:
    build:
      context: frameworks/nodejs/fastify
      dockerfile: Dockerfile
    container_name: pos-server-node-post
    ports:
      - "8002:8002"
    environment:
      DB_HOST: benchmark-postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASS: secret
      DB_NAME: benchmark_db
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  server-php:
    build:
      context: frameworks/php/swoole
      dockerfile: Dockerfile
    container_name: pos-server-php-post
    ports:
      - "8003:8003"
    environment:
      DB_HOST: benchmark-postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASS: secret
      DB_NAME: benchmark_db
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  server-go:
    build:
      context: frameworks/go/fiber
      dockerfile: Dockerfile
    container_name: pos-server-go-post
    ports:
      - "8004:8004"
    environment:
      DB_HOST: benchmark-postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASS: secret
      DB_NAME: benchmark_db
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  server-java:
    build:
      context: frameworks/java/springboot
      dockerfile: Dockerfile
    container_name: pos-server-java-post
    ports:
      - "8005:8005"
    environment:
      DB_HOST: benchmark-postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASS: secret
      DB_NAME: benchmark_db
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

networks:
  default:
    name: db_default
    external: true
